<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Square Game</title>

    <link rel="stylesheet" href="game.css">
    <script src="game.js" defer></script>
<link rel="stylesheet" href="../assignment-fixes.css"></head>

<body><a class="portfolio-back" href="../../index.html#work">← Back to portfolio</a>

    <fieldset>
        <legend>Control</legend>

        <label for="numbox">Number of box:</label>

        <input
            type="text"
            name="numbox"
            id="numbox"
            placeholder="e.g. 10"
        >
        <select name="color" id="color">
            <option value="maroon">Maroon</option>
            <option value="lightgreen">Lightgreen</option>
            <option value="magenta">Magenta</option>
        </select>
        <button type="button" id="start">Start</button>

        <div id="timerClock">
            Timer:
            <div id="clock">6</div>
        </div>
    </fieldset>

    <div id="container">
        <div id="layer"></div>
    </div>

</body>
</html>
